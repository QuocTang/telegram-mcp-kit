[project]
name = "telegram-mcp-kit"
version = "0.3.0"
description = "Telegram Bot API integration via MCP"
readme = "README.md"
license = "MIT"
authors = [
    { name = "QuocTang", email = "tang.ai.quoc123@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.29.0,<1",
    "mcp[cli]>=2.3.0,<3",
    "pydantic-settings>=2.16.3,<3",
]

[project.urls]
Repository = "https://github.com/QuocTang/telegram-mcp-kit"
Issues = "https://github.com/QuocTang/telegram-mcp-kit/issues"

[dependency-groups]
dev = [
    "pytest>=9.2.0,<10",
    "pytest-asyncio>=1.5.0,<2",
    "ruff>=0.17.6,<0.18",
]

[project.scripts]
telegram-mcp-kit = "telegram_mcp_kit.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telegram_mcp_kit"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
